name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - run: go vet ./...
      - run: go test ./...

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The parity tests run the server's own rollup (api/), which needs its packages.
      - run: npm ci --prefix api
      # The built site in pages/site is stamped and identical to the collector's embedded copy;
      # the adapter, account-history and quota tests, the page's own tests and the type check pass.
      - run: npm run check:pages
      - run: npm run test:dashboard
      - run: node pages/scripts/build-index.mjs pages
      # The dashboard still builds from source.
      - run: npx vite build --config vite.pages.config.ts --outDir /tmp/site-check --emptyOutDir
